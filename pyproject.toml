[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "work-order-qa-demo"
version = "0.1.0"
description = "Local work-order test target and Playwright Python QA portfolio"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3,<10",
    "pytest-playwright>=0.7,<1",
    "pytest-html>=4.1,<5",
]

[tool.setuptools.packages.find]
include = ["demo_app*"]

[tool.setuptools.package-data]
demo_app = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config --tracing retain-on-failure --screenshot only-on-failure --full-page-screenshot --output artifacts/browser"
markers = [
    "smoke: critical application behavior",
    "regression: rule and negative-path checks",
    "e2e: cross-layer browser/API workflows",
]
