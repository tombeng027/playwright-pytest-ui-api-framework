name: QA verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Python 3.14 / ${{ matrix.os }} / Chromium
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install pinned package and tests (non-editable)
        run: |
          python -m pip install -c constraints.txt ".[test]"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pip freeze | Out-File -Encoding utf8 artifacts/installed-packages.txt
      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify installed package and assets outside checkout
        run: |
          $root = $env:GITHUB_WORKSPACE
          Set-Location $env:RUNNER_TEMP
          python "$root/scripts/check_package.py"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run default tests against installed package
        run: |
          $root = $env:GITHUB_WORKSPACE
          Set-Location $env:RUNNER_TEMP
          python -m pytest "$root/tests" -c "$root/pyproject.toml" --import-mode=importlib --browser chromium --output "$root/artifacts/browser" --app-log-dir "$root/artifacts/logs" --html="$root/artifacts/report.html" --self-contained-html --junitxml="$root/artifacts/results.xml"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify controlled defect
        run: |
          python scripts/verify_defect.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain synthetic test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-evidence-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            artifacts/report.html
            artifacts/results.xml
            artifacts/installed-packages.txt
            artifacts/logs/
            artifacts/browser/
            artifacts/defect-demo/
